<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <title>PawsConnect - Pet Adoption & Rescue Management System</title>

    <!--
      Pre-React splash.

      The stylesheet for the app is bundled by JS, so without this the browser paints a
      blank white frame until the bundle boots. Inlined deliberately: it must render
      before any stylesheet resolves. React removes it on mount, and the
      `boot-failsafe` animation hides it even if JS never runs, so it can never
      permanently cover the app.
    -->
    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background-color: #fff;
        background-image:
          radial-gradient(36rem 36rem at 78% 22%, rgba(233, 122, 44, 0.16), transparent 60%),
          radial-gradient(28rem 28rem at 18% 82%, rgba(233, 122, 44, 0.1), transparent 60%);
        font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
        animation: boot-failsafe 0s linear 4s forwards;
      }

      @keyframes boot-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      #app-boot .boot-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #e97a2c;
        box-shadow: 0 12px 32px rgba(233, 122, 44, 0.35);
        animation: boot-pulse 1.8s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }

      #app-boot .boot-word {
        display: flex;
        font-family: 'Instrument Serif', ui-serif, Georgia, serif;
        font-size: 2rem;
        letter-spacing: -0.02em;
        color: #111;
      }

      #app-boot .boot-word span {
        display: inline-block;
        opacity: 0;
        transform: translateY(18px);
        animation: boot-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      #app-boot .boot-word span:nth-child(1) { animation-delay: 0.05s; }
      #app-boot .boot-word span:nth-child(2) { animation-delay: 0.11s; }
      #app-boot .boot-word span:nth-child(3) { animation-delay: 0.17s; }
      #app-boot .boot-word span:nth-child(4) { animation-delay: 0.23s; }
      #app-boot .boot-word span:nth-child(5) { animation-delay: 0.29s; }
      #app-boot .boot-word span:nth-child(6) { animation-delay: 0.35s; }
      #app-boot .boot-word span:nth-child(7) { animation-delay: 0.41s; }
      #app-boot .boot-word span:nth-child(8) { animation-delay: 0.47s; }
      #app-boot .boot-word span:nth-child(9) { animation-delay: 0.53s; }

      @keyframes boot-rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #app-boot .boot-track {
        position: relative;
        width: 168px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(17, 17, 17, 0.12);
      }

      #app-boot .boot-track::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: #e97a2c;
        transform-origin: left center;
        animation: boot-fill 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes boot-fill {
        0% { transform: scaleX(0); }
        55% { transform: scaleX(1); }
        100% { transform: scaleX(1); opacity: 0; }
      }

      #app-boot .boot-note {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.625rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(17, 17, 17, 0.45);
      }

      @media (prefers-reduced-motion: reduce) {
        #app-boot .boot-mark,
        #app-boot .boot-word span {
          animation: none;
          opacity: 1;
          transform: none;
        }
        #app-boot .boot-track::after {
          animation: none;
          transform: scaleX(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="app-boot" role="status" aria-live="polite">
      <span class="boot-mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
          <ellipse cx="6.2" cy="10.4" rx="2.1" ry="2.6" />
          <ellipse cx="10" cy="6.9" rx="2.1" ry="2.7" />
          <ellipse cx="14" cy="6.9" rx="2.1" ry="2.7" />
          <ellipse cx="17.8" cy="10.4" rx="2.1" ry="2.6" />
          <path d="M12 12.4c2.6 0 4.9 1.9 4.9 4.1 0 1.7-1.3 2.8-3.1 2.8-.8 0-1.3-.2-1.8-.2s-1 .2-1.8.2c-1.8 0-3.1-1.1-3.1-2.8 0-2.2 2.3-4.1 4.9-4.1Z" />
        </svg>
      </span>
      <span class="boot-word">
        <span>P</span><span>a</span><span>w</span><span>s</span><span>&amp;</span><span>H</span><span>o</span><span>m</span><span>e</span><span>s</span>
      </span>
      <span class="boot-track"></span>
      <span class="boot-note">Finding a forever friend</span>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
