# Render Blueprint — one Web Service that serves both the Express API and the
# built React SPA from the same origin (see backend/src/app.js).
#
# Why one service: Render scans for an open port after the start command runs.
# Starting `npm run dev` (Vite dev server + `node --watch`) binds only to
# 127.0.0.1, so the scan reports "No open ports detected" and the two Node
# processes eventually abort with exit status 134 (V8 out of memory).
#
# `npm start` runs the API only, on 0.0.0.0:$PORT, and serves my-project/dist.
#
# Database: set DATABASE_URL to the Supabase session pooler PostgreSQL connection string.
# Migrations use the corresponding direct endpoint automatically.
# Set DATABASE_URL in the Render dashboard; local .env files are not deployed.
#
# Secrets: DATABASE_URL / ADMIN_PASSWORD / BREVO_API_KEY are not in the repo, so they
# are marked `sync: false` and must be entered once in the Render dashboard.
services:
  - type: web
    name: pawsandhomes
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://pawsandhomes-hfkn.onrender.com
      - key: APP_URL
        value: https://pawsandhomes-hfkn.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # HTTPS email delivery works on Render Free (SMTP ports are blocked).
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
